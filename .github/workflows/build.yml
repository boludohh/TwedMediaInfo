name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
    # La publicación a Maven Central se dispara solo por tag v* (p. ej. v0.2.0).
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# En main y en los tags no se cancela una ejecución en curso, para no cortar una publicación a medias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "37"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=10g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Compilar TwedMediaInfo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Preparar entorno Android
        uses: ./.github/actions/setup-android

      # Sin job de tests: las pruebas se ejecutan en la app TwedMediaInfoTest sobre dispositivos físicos.
      - name: Compilar AAR Release y ejecutar lint
        run: |
          ./gradlew :lib:assembleRelease :lib:lint --stacktrace --no-daemon

      - name: Subir AAR como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twedmediainfo-aar
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: warn

  # Solo corre al empujar un tag v* y únicamente si el build pasó.
  # Los secrets viven solo en este job y nunca llegan a pull requests de forks.
  # Con automaticRelease = false el deployment queda pendiente: hay que
  # tocar "Publish" (o "Drop") a mano en central.sonatype.com > Deployments.
  publish:
    name: Publicar en Maven Central
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      # Falla ANTES de publicar si el tag no coincide con VERSION_NAME de gradle.properties.
      - name: Verificar que el tag coincide con VERSION_NAME
        run: |
          set -euo pipefail

          VERSION_NAME="$(grep -E '^VERSION_NAME=' gradle.properties | head -n 1 | cut -d= -f2 | tr -d '[:space:]')"

          if [ -z "${VERSION_NAME}" ]; then
            echo "ERROR: no se encontró VERSION_NAME en gradle.properties."
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "v${VERSION_NAME}" ]; then
            echo "ERROR: el tag '${GITHUB_REF_NAME}' no coincide con VERSION_NAME='${VERSION_NAME}' (se esperaba 'v${VERSION_NAME}')."
            exit 1
          fi

          echo "Tag ${GITHUB_REF_NAME} coincide con VERSION_NAME=${VERSION_NAME}"

      - name: Preparar entorno Android
        uses: ./.github/actions/setup-android

      - name: Compilar AAR Release
        run: |
          ./gradlew :lib:assembleRelease --stacktrace --no-daemon

      # Se sube antes de publicar para que el AAR quede guardado aunque falle la publicación.
      - name: Subir AAR como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twedmediainfo-aar-publish
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Publicar en Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          for var in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!var}" ]; then
              echo "ERROR: falta el secret asociado a ${var}."
              exit 1
            fi
          done

          ./gradlew :lib:publishToMavenCentral --stacktrace --no-daemon
