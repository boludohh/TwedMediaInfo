name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Evita cancelar ejecuciones de main para no interrumpir un deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "37"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=10g -Dfile.encoding=UTF-8"

jobs:
  build:
    name: Compilar TwedMediaInfo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Preparar entorno Android
        uses: ./.github/actions/setup-android

      # Las pruebas se ejecutan en la app TwedMediaInfoTest sobre dispositivos físicos.
      - name: Compilar AAR Release y ejecutar lint
        run: |
          ./gradlew :lib:assembleRelease :lib:lint --stacktrace --no-daemon

      - name: Subir AAR como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twedmediainfo-aar
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: warn

  # En los pushes a main, crea un deployment en Sonatype que queda pendiente
  # para confirmarlo manualmente en central.sonatype.com > Deployments.
  # En pull requests este job no se ejecuta.
  publish:
    name: Crear deployment pendiente en Maven Central
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Preparar entorno Android
        uses: ./.github/actions/setup-android

      - name: Compilar AAR Release
        run: |
          ./gradlew :lib:assembleRelease --stacktrace --no-daemon

      - name: Subir AAR como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twedmediainfo-aar-publish
          path: lib/build/outputs/aar/*.aar
          if-no-files-found: warn

      - name: Publicar en Sonatype (deployment pendiente)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          for var in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!var}" ]; then
              echo "ERROR: falta el secret asociado a ${var}."
              exit 1
            fi
          done

          ./gradlew :lib:publishToMavenCentral --stacktrace --no-daemon
