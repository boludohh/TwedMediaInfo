name: Preparar entorno Android
description: >
  Configura Java 17, Android SDK, plataforma, NDK y CMake, escribe local.properties,
  exporta ANDROID_NDK_HOME y verifica la toolchain y third_party. Requiere que el
  repositorio ya esté descargado (actions/checkout con submódulos) y que el workflow
  defina NDK_VERSION, CMAKE_VERSION y COMPILE_SDK en env.

runs:
  using: composite
  steps:
    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Instalar plataforma Android, NDK y CMake
      shell: bash
      run: |
        set -euo pipefail

        SDKMANAGER_BIN="$(command -v sdkmanager || true)"

        if [ -z "${SDKMANAGER_BIN}" ]; then
          for candidate in \
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "${candidate}" ]; then
              SDKMANAGER_BIN="${candidate}"
              break
            fi
          done
        fi

        if [ -z "${SDKMANAGER_BIN}" ]; then
          echo "No se encontró sdkmanager en el PATH ni en ANDROID_HOME/ANDROID_SDK_ROOT."
          exit 1
        fi

        echo "Usando sdkmanager: ${SDKMANAGER_BIN}"

        yes | "${SDKMANAGER_BIN}" --licenses > /dev/null 2>&1 || true

        "${SDKMANAGER_BIN}" --install \
          "platform-tools" \
          "platforms;android-${COMPILE_SDK}.0" \
          "ndk;${NDK_VERSION}" \
          "cmake;${CMAKE_VERSION}"

    - name: Preparar local.properties y ANDROID_NDK_HOME
      shell: bash
      run: |
        set -euo pipefail

        SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

        if [ -z "${SDK_DIR}" ]; then
          echo "No se encontró ANDROID_HOME ni ANDROID_SDK_ROOT."
          exit 1
        fi

        echo "sdk.dir=${SDK_DIR}" > local.properties

        echo "ANDROID_NDK_HOME=${SDK_DIR}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Verificar toolchain y third_party
      shell: bash
      run: |
        set -euo pipefail

        java -version

        if [ ! -d "${ANDROID_NDK_HOME}" ]; then
          echo "No existe el NDK esperado en ${ANDROID_NDK_HOME}"
          exit 1
        fi

        if [ -x "${ANDROID_NDK_HOME}/ndk-build" ]; then
          "${ANDROID_NDK_HOME}/ndk-build" --version || true
        else
          echo "WARN: ndk-build no encontrado en ${ANDROID_NDK_HOME}"
        fi

        for required_dir in \
          third_party/MediaInfoLib-26.05/Source \
          third_party/ZenLib-0.4.41/Source \
          third_party/zlib-1.3.2; do
          if [ ! -d "${required_dir}" ]; then
            echo "Falta la carpeta ${required_dir}."
            echo "Asegúrate de tener third_party dentro del repositorio o como submódulos."
            exit 1
          fi
        done

    - name: Dar permisos al wrapper de Gradle
      shell: bash
      run: |
        chmod +x ./gradlew || true
